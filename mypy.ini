[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
pretty = True
show_error_codes = True
show_column_numbers = True

# Tests get slightly relaxed treatment — fixtures often need Any
[mypy-test.*]
disallow_untyped_decorators = False

# Third-party libraries without stubs — silence "missing imports" noise
[mypy-duckdb.*]
ignore_missing_imports = True

# Optional: the `menu` extra (fastembed, which brings numpy; playwright) and the
# ephemeral scikit-learn used only to re-train the page classifier. CI installs
# neither.
[mypy-fastembed.*,numpy.*,sklearn.*,playwright.*]
ignore_missing_imports = True
