# Reviewed Identity corrections (S6e; gate 1a location correction plan).
#
# Applied by `python -m apps.discovery.corrections --actor <reviewer>` after a
# discovery run, and again after any rebuild: applying is idempotent, an entry
# already in effect writes nothing. Keys are Overture GERS ids, never Subject
# ids, so the file survives a rebuild. Every decision is a human Adjudication
# that cites this file, the entry id, its rationale and evidence URL.
#
# merges: records of ONE outlet. `merge` records join the survivor's venue;
#   the merged-away venues retire into it through lineage, and their
#   Organization/Place merge into the survivor's when no other current venue
#   uses them.
#   id:           (required) stable entry id, e.g. the review pair id
#   survivor:     (required) GERS id of the record whose venue survives
#   merge:        (required) nonempty list of GERS ids of the same outlet
#   rationale:    (required) why these are one outlet and why this survivor
#   evidence_url: (required) HTTP(S) page supporting the decision
#
# retirements: records that are not a venue (an event, an office, a legal
#   entity). The venue retires and its records go to needs_review, so discovery
#   never re-mints them.
#   id, gers_id, rationale, evidence_url: as above
#
# Survivor rule: the record whose address and point match the official
# location page; on a tie, the trading name as the official page shows it; then
# the lower Subject id. Subject ids in comments are from the 2026-09-28 Pi
# rebuild; pair ids and notes are from the adjudicated precision review
# (docs/reviews/data/2026-09-28-precision-review/reviewed.json at b2bba73).
# Each GERS id appears at most once in this file.
#
# Plan: docs/reviews/2026-09-28-location-correction-plan.md

