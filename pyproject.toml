[project]
name = "helios-learning"
version = "0.1.0"
description = "Helios V2 learning/tooling workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "duckdb>=1.1.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.51",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the `packages.*` namespace
# (mirrors alembic.ini's prepend_sys_path = .).
pythonpath = ["."]
# A hung test (e.g. a concurrency test stuck on a lock) fails instead of
# running until the CI job is killed. Per-test ceiling, in seconds.
timeout = 300

[tool.coverage.run]
# Measure application code only; counting test files inflated the total.
# The CI threshold (--cov-fail-under) lives in ci.yml, not here, because
# local runs without a database skip the DB tests and would always fail it.
omit = ["test/*"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12",
]
