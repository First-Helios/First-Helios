name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on a PR branch when a new commit lands. Pushes to
# main are never cancelled, so every main commit gets a completed run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token; no job needs to write to the repository.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tags are mutable); the comment names the
# release. uv is pinned to the version infra/Dockerfile copies in.

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen


      - name: Run mypy
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    # pytest-timeout fails a single hung test; this bounds the whole job.
    timeout-minutes: 30

    services:
      postgres:
        # Same image as infra/docker-compose.yml — CI runs amd64 where the
        # official postgis image would also work, but keeping them identical
        # is the point (see docs/adr/0002-containerization.md).
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://helios:helios@localhost:5432/helios_test
          HELIOS_STRICT_DB_TESTS: "1"
        # The threshold applies here, where every DB test runs; local runs
        # without a database skip those tests and would always fall short.
        run: uv run pytest --cov=. --cov-report=term-missing --cov-fail-under=88

      # Models and migrations must agree: a models.py change without a
      # migration (or vice versa) fails here instead of merging.
      - name: Models match migrations (alembic check)
        env:
          DATABASE_URL: postgresql://helios:helios@localhost:5432/helios_test
        run: |
          uv run alembic upgrade head
          uv run alembic check

  lockfile:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.0"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The smoke test migrates this empty database from the image (ADR-0031 D3).
    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: helios-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image's HEALTHCHECK reports healthy, `alembic upgrade head` runs from the image, and
      # /readyz and /v1/venues answer 200 on the migrated, empty database.
      - name: Smoke test (health, migrate, readyz)
        run: bash infra/ci/docker-smoke.sh helios-api:ci

      - name: Container logs on failure
        if: failure()
        run: docker logs helios-api || true

  # Native arm64 build of both images (ADR-0031 D3, Q12): the Pi builds arm64 at deploy time, so
  # an arm-only break (the worker's Chromium is the likeliest) shows up here instead of on the Pi.
  # Not a required check at first: the owner adds it to branch protection after two weeks of PRs.
  # Its own cache scopes, so the amd64 job's cache isn't overwritten.
  docker-arm64:
    name: Docker image (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (runtime)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: helios-api:ci
          cache-from: type=gha,scope=arm64-runtime
          cache-to: type=gha,mode=max,scope=arm64-runtime

      - name: Smoke test (health, migrate, readyz)
        run: bash infra/ci/docker-smoke.sh helios-api:ci

      - name: Build image (worker)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/Dockerfile
          target: worker
          push: false
          cache-from: type=gha,scope=arm64-worker
          cache-to: type=gha,mode=max,scope=arm64-worker

      - name: Container logs on failure
        if: failure()
        run: docker logs helios-api || true
