# Named so `docker compose ps`/`down` from any cwd targets this stack
# specifically instead of falling back to a directory-derived name (R114).
name: helios

services:
  postgres:
    # NOT the official postgis/postgis image: that one is amd64-only by
    # design, so it fails with `exec format error` on ARM64 hosts like the
    # Orange Pi staging box. This is a fork of the official build system by
    # the official image's co-maintainer, publishing multi-arch tags.
    # See docs/adr/0002-containerization.md.
    # Pinned by digest for reproducible pulls; tag kept in the comment for
    # humans (R90).
    image: imresamu/postgis@sha256:6da75969915039b7356058b4310d43fde88c275ada982c2dfee29da68445ff4d  # 16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helios}
      POSTGRES_DB: ${POSTGRES_DB:-helios}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helios} -d ${POSTGRES_DB:-helios}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: runs to completion, then exits. Kept separate from the api
  # service so migrations never race across replicas on startup.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["alembic", "upgrade", "head"]
    # HELIOS_COMPOSE_DATABASE_URL, not DATABASE_URL: a shell that already
    # exports DATABASE_URL (e.g. to point `make ci`/alembic at a disposable
    # *_test database) must never leak into this container's DB target (R86).
    environment:
      DATABASE_URL: ${HELIOS_COMPOSE_DATABASE_URL:-postgresql+psycopg://helios:helios@postgres:5432/helios}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: ${HELIOS_COMPOSE_DATABASE_URL:-postgresql+psycopg://helios:helios@postgres:5432/helios}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Discovery CLIs (run via `docker compose exec api ...` on the Pi) cache
      # to var/; without this the cache is lost on every container recreate (R113).
      - ../var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim base image has no curl; use the interpreter that's already here.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
