# Named so `docker compose ps`/`down` from any cwd targets this stack
# specifically instead of falling back to a directory-derived name (R114).
name: helios

services:
  postgres:
    # NOT the official postgis/postgis image: that one is amd64-only by
    # design, so it fails with `exec format error` on ARM64 hosts like the
    # Orange Pi staging box. This is a fork of the official build system by
    # the official image's co-maintainer, publishing multi-arch tags.
    # See docs/adr/0002-containerization.md.
    # Pinned by digest for reproducible pulls; tag kept in the comment for
    # humans (R90).
    image: imresamu/postgis@sha256:6da75969915039b7356058b4310d43fde88c275ada982c2dfee29da68445ff4d  # 16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helios}
      POSTGRES_DB: ${POSTGRES_DB:-helios}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helios} -d ${POSTGRES_DB:-helios}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: runs to completion, then exits. Kept separate from the api
  # service so migrations never race across replicas on startup.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["alembic", "upgrade", "head"]
    # HELIOS_COMPOSE_DATABASE_URL, not DATABASE_URL: a shell that already
    # exports DATABASE_URL (e.g. to point `make ci`/alembic at a disposable
    # *_test database) must never leak into this container's DB target (R86).
    environment:
      DATABASE_URL: ${HELIOS_COMPOSE_DATABASE_URL:-postgresql+psycopg://helios:helios@postgres:5432/helios}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: ${HELIOS_COMPOSE_DATABASE_URL:-postgresql+psycopg://helios:helios@postgres:5432/helios}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Discovery CLIs (run via `docker compose exec api ...` on the Pi) cache
      # to var/; without this the cache is lost on every container recreate (R113).
      - ../var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim base image has no curl; use the interpreter that's already here.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Discovery and menu-pipeline CLIs with the `menu` extra (page classifier,
  # ADR-0013). Behind the `menu` profile, so `make dev` and CI are unchanged:
  #   docker compose --profile menu run --rm worker python -m apps.menu_pipeline.models download potion-base-8M
  #   docker compose --profile menu run --rm worker python -m apps.discovery.resolve_urls
  # With page rendering (headed Chromium needs a display; ADR-0013 §4):
  #   docker compose --profile menu run --rm worker \
  #     xvfb-run -a python -m apps.discovery.resolve_urls --render
  worker:
    profiles: ["menu"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    # xvfb-run hangs as PID 1 (it waits for Xvfb's ready signal), so an init
    # process runs first; Chromium needs more shared memory than Docker's 64 MB.
    init: true
    shm_size: 1gb
    environment:
      DATABASE_URL: ${HELIOS_COMPOSE_DATABASE_URL:-postgresql+psycopg://helios:helios@postgres:5432/helios}
    volumes:
      - ../var:/app/var  # model files (var/models) and the site cache
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot: checks the extraction model's GGUF against config/models.yaml, so
  # llama-server never serves a file the manifest doesn't pin (ADR-0013 §3). Runs
  # in the API image (models.py needs no extras) and needs no database.
  llama-model-check:
    profiles: ["menu"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "apps.menu_pipeline.models", "verify", "Qwen3-4B-Instruct-2507-Q4_0"]
    volumes:
      - ../var/models:/app/var/models:ro
    restart: "no"

  # The extraction model's server (ADR-0013 §1, §3; slice 1, Amendment 6). No host
  # port: only services on the Compose network reach it, at http://llama-server:8080.
  # Upstream's CPU server image; Pi-only core pinning is in docker-compose.pi.yml.
  #   docker compose --profile menu up -d llama-server
  # Flags are the spike's measured set: 2 slots of 4096 tokens, flash attention,
  # q8_0 KV cache, and no host prompt cache (13.8 GB peak RSS with it, 5.2 GB without).
  llama-server:
    profiles: ["menu"]
    # Pinned by digest (R90); the spike ran llama.cpp 84e76d8 = b11173, which has
    # no upstream image. b11176 adds three commits, none on the CPU path.
    image: ghcr.io/ggml-org/llama.cpp@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af  # server-b11176
    command:
      - --model
      - /models/Qwen3-4B-Instruct-2507-Q4_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - "4"
      - --parallel
      - "2"
      - --ctx-size
      - "8192"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-ram
      - "0"
    volumes:
      - ../var/models/Qwen3-4B-Instruct-2507-Q4_0:/models:ro
    mem_limit: 8g  # spike peak RSS 5.2 GB; the spike's original RAM bar
    depends_on:
      llama-model-check:
        condition: service_completed_successfully
    healthcheck:
      # /health answers 503 while the model loads, 200 once it can serve.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
